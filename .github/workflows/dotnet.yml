name: .NET build and tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SignalCluster.sln
      - name: Build
        run: dotnet build SignalCluster.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SignalCluster.sln --configuration Release --no-build --verbosity normal
